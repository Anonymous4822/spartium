name: Pipeline Docker pour Flask

on:
  push:
    branches:
      - develop

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout du code
        uses: actions/checkout@v4

      - name: 🔍 Vérifier si l’image existe déjà localement
        id: check-image
        run: |
          if docker image inspect mon-app:latest > /dev/null 2>&1; then
            echo "IMAGE_EXISTS=true" >> $GITHUB_ENV
            echo "✅ L'image mon-app:latest existe déjà."
          else
            echo "IMAGE_EXISTS=false" >> $GITHUB_ENV
            echo "⚠️ L'image n'existe pas encore, elle va être construite."
          fi

      - name: 🔨 Construire l’image Docker (si nécessaire)
        if: env.IMAGE_EXISTS == 'false'
        run: |
          echo "🚀 Construction de l'image Docker..."
          docker build -t devops-app:latest .

      - name: 🛑 Arrêter l’ancien conteneur (s’il existe)
        continue-on-error: true
        run: docker stop devops-app || true

      - name: 🗑️ Supprimer l’ancien conteneur (s’il existe)
        continue-on-error: true
        run: docker rm devops-app || true

      - name: 🚀 Démarrer le nouveau conteneur
        run: |
          docker run -d --name devops-app -p 3000:3000 devops-app:latest
          echo "✅ Conteneur lancé avec succès !"

      - name: 🔎 Vérifier si le conteneur tourne bien
        run: docker ps | grep devops-app